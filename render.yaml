# Render blueprint — the FastAPI backend only. The Next.js frontend is deployed
# separately on Vercel with the Root Directory set to `frontend`.
#
# Deploy the backend first: Vercel bakes NEXT_PUBLIC_API_URL into the browser
# bundle at build time, so the backend URL has to exist before the frontend is
# built.
services:
  - type: web
    name: moltel-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0
      # A free-tier key only: paid models answer HTTP 402.
      - key: OPENROUTER_MODEL
        value: nvidia/nemotron-3-super-120b-a12b:free
      # Left unset, the app still works and says plainly that AI synthesis was
      # not produced. Set it in the dashboard, never commit it.
      - key: OPENROUTER_API_KEY
        sync: false
      # Exact origin(s) of the deployed frontend, comma-separated. Without this
      # the browser cannot read the API at all. Vercel gives every deployment
      # preview its own random *.vercel.app URL; those are not listed here, so
      # preview deploys cannot call the API — only the domains below can.
      - key: FRONTEND_ORIGIN
        value: https://moltel.vercel.app,https://moltel-git-main-lse-ngine.vercel.app
      - key: NCBI_EMAIL
        sync: false
